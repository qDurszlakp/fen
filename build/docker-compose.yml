version: '3.8'

networks:
  fen_network:
    driver: bridge

services:
  gateway:
    image: docker.io/library/nginx:1.25.5-alpine
    container_name: gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    networks:
      - fen_network
    depends_on:
      - server

  server:
    build:
      context: ../Server
      dockerfile: dockerfile
    image: 'server:latest'
    restart: on-failure
    depends_on:
      - db
      - kafka
    networks:
      - fen_network
    volumes:
      - /app/data
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  server-debug:
    build:
      context: ../Server
      dockerfile: dockerfile
    image: 'server:latest'
    container_name: server-debug
    restart: on-failure
    ports:
      - "5005:5005"
    depends_on:
      - db
      - kafka
    networks:
      - fen_network
    volumes:
      - /app/data
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  foo:
    build:
      context: ../Foo
      dockerfile: dockerfile
    image: 'foo:latest'
    container_name: foo
    ports:
      - "5006:5005"
    depends_on:
      - kafka
    networks:
      - fen_network
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  db:
    image: 'docker.io/library/postgres:17.3-alpine'
    container_name: database
    networks:
      - fen_network
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev

  zookeeper:
    image: 'docker.io/confluentinc/cp-zookeeper:7.0.1'
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - fen_network
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka:
    image: 'docker.io/confluentinc/cp-kafka:7.0.1'
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - fen_network
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper

  kafka-setup:
    image: 'docker.io/confluentinc/cp-kafka:7.0.1'
    container_name: kafka-setup
    depends_on:
      - kafka
    networks:
      - fen_network
    volumes:
      - ./create-kafka-topics.sh:/scripts/create-kafka-topics.sh:z
    command: ["/bin/bash", "/scripts/create-kafka-topics.sh"]
