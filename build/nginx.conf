events {
    worker_connections 10;
}

http {

    upstream backend_servers {
        server server:8080;
    }

    upstream backend_server_debug {
        server server-debug:8080;
    }

    # X-Debug: 1 -> debug
    map $http_x_debug $target_upstream {
        default        backend_servers;
        "1"            backend_server_debug;
    }

    # cookie debug=1 -> debug
    map $cookie_debug $final_upstream {
        default        $target_upstream;
        "1"            backend_server_debug;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://$final_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}