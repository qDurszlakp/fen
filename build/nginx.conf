events {
    worker_connections 1024; # Default value, can be adjusted
}

http {
    # Defines the group of backend servers
    upstream backend_servers {
        # The name 'server' will be automatically resolved by Docker Compose
        # to the IP addresses of all containers for the 'server' service.
        # Nginx will use round-robin by default to distribute traffic.
        server server:8080; # Important: INTERNAL port where the application listens inside the server container
    }

    server {
        listen 80; # Nginx listens on port 80 inside the container

        location / {
            proxy_pass http://backend_servers; # Redirect traffic to the backend_servers group

            # Add headers so the backend application knows about the original request
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade"; # Necessary for WebSocket support if needed
        }
    }
}