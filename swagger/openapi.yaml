openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
paths:
  /rest/file/{content}:
    post:
      tags:
      - rest-api
      operationId: file
      parameters:
      - name: content
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /db/country:
    post:
      tags:
      - db-api
      operationId: createCountry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountryDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountryDto"
  /db/account:
    post:
      tags:
      - db-api
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountDto"
  /rest/risk:
    get:
      tags:
      - rest-api
      operationId: risk
      responses:
        "200":
          description: OK
  /rest/posts:
    get:
      tags:
      - rest-api
      operationId: posts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostDto"
  /rest/passphrase:
    get:
      tags:
      - rest-api
      operationId: passphrase
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /rest/cookies:
    get:
      tags:
      - rest-api
      operationId: cookies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /db/cards:
    get:
      tags:
      - db-api
      operationId: cards
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardDto"
  /db/accounts:
    get:
      tags:
      - db-api
      operationId: accounts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountDto"
components:
  schemas:
    CreateCountryDto:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
    CountryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        insertTime:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
    CreateAccountDto:
      type: object
      properties:
        accountNumber:
          type: string
    AccountDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        accountNumber:
          type: string
    PostDto:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
    CardDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        cardNumber:
          type: string
        accountNumber:
          type: string
