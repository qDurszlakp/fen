<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Applications</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #fff;
            --border: #dcdfe4;
            --text: #1f2328;
            --muted: #656d76;
            --post: #2da44e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 2rem 1rem;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap { max-width: 1600px; margin: 0 auto; }

        .list-controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
        .list-controls input { flex: 1; min-width: 200px; }

        .table-scroll { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: .85rem; }

        th, td {
            text-align: left;
            padding: .5rem .6rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th.col-desc, td.col-desc {
            width: 100%;
            white-space: normal;
        }

        td.col-desc input {
            width: 100%;
            min-width: 160px;
        }

        table select {
            width: auto;
        }

        table button {
            padding: .3rem .55rem;
            font-size: .8rem;
            white-space: nowrap;
        }

        button.delete-btn {
            padding: .3rem .5rem;
            font-size: .8rem;
            line-height: 1;
        }

        th {
            color: var(--muted);
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        tr:hover td { background: rgba(127, 127, 127, .06); }

        .muted { color: var(--muted); }

        .count { font-size: .8rem; color: var(--muted); }

        h1 { margin: 0 0 .25rem; font-size: 1.5rem; }

        .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .auth { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

        h2 {
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            margin: 1.5rem 0 .5rem;
        }

        label {
            display: block;
            font-size: .8rem;
            color: var(--muted);
            margin: .8rem 0 .3rem;
        }

        label:first-of-type { margin-top: 0; }

        input, select {
            padding: .45rem .6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            width: 100%;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-top: .8rem;
        }

        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; }

        .auth-state {
            font-size: .8rem;
            color: var(--muted);
            margin-left: auto;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            word-break: break-all;
        }

        button {
            padding: .5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #f6f8fa;
            font: inherit;
            font-size: .9rem;
            cursor: pointer;
        }

        button:hover { background: #eaeef2; }

        button.primary {
            background: var(--post);
            border-color: var(--post);
            color: #fff;
            margin-top: 1.2rem;
        }

        button.primary:hover { filter: brightness(1.05); }

        .out {
            background: #0d1117;
            color: #e6edf3;
            border-radius: 8px;
            padding: 1rem;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: .82rem;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 4rem;
            max-height: 22rem;
            overflow: auto;
        }

        .status { font-weight: 700; }
        .status.ok { color: #3fb950; }
        .status.bad { color: #ff7b72; }

        tr.modified td { background: rgba(220, 160, 0, 0.12); }
        .row-actions { display: inline-flex; gap: .35rem; align-items: center; white-space: nowrap; }
        .edit-actions { display: inline-flex; gap: .35rem; }
        button.save-btn {
            background: var(--post);
            border-color: var(--post);
            color: #fff;
            padding: .3rem .55rem;
            font-size: .8rem;
        }
        button.save-btn:hover { filter: brightness(1.05); }
        button.cancel-btn {
            padding: .3rem .55rem;
            font-size: .8rem;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color .15s ease;
        }
        th.sortable:hover {
            color: var(--text);
        }
        th.sorted {
            color: var(--text);
            font-weight: 700;
        }
        .sort-icon {
            font-size: .65rem;
            margin-left: .2rem;
            display: inline-block;
        }
        .cv-actions {
            display: inline-flex;
            gap: .25rem;
            align-items: center;
            white-space: nowrap;
        }

        .links { font-size: .85rem; }
        .links a { color: #1f6feb; }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --panel: #161b22;
                --border: #30363d;
                --text: #e6edf3;
                --muted: #8b949e;
            }
            button { background: #21262d; color: var(--text); }
            button:hover { background: #30363d; }
            input, select { background: #0d1117; color: var(--text); }
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Job Applications</h1>

    <div class="panel auth">
        <input id="user" placeholder="username" autocomplete="username" value="admin">
        <input id="pass" type="password" placeholder="password" autocomplete="current-password" value="admin">
        <button onclick="login()">Login</button>
        <span class="auth-state" id="authState">not logged in</span>
    </div>

    <form class="panel" id="jobForm" onsubmit="submitApplication(event)">
        <label for="companyName">Company name</label>
        <input id="companyName" name="companyName" required value="Acme Corp">

        <label for="rateType">Rate</label>
        <select id="rateType" name="rateType">
            <option value="HOURLY">Hourly</option>
            <option value="MONTHLY">Monthly</option>
        </select>

        <label for="rateAmount">Rate amount</label>
        <input id="rateAmount" name="rateAmount" type="number" step="0.01" min="0" value="150">

        <div class="checkbox-row">
            <input id="paidLeave" type="checkbox">
            <label for="paidLeave">Paid leave</label>
        </div>

        <label for="vacationDays">Vacation days</label>
        <input id="vacationDays" type="number" min="0" value="20">

        <label for="cv">CV (PDF)</label>
        <input id="cv" type="file" accept="application/pdf">

        <button class="primary" type="submit">Submit application</button>
    </form>

    <h2>Response</h2>
    <div class="out" id="out">Fill the form and submit.</div>

    <h2>Applications</h2>
    <div class="panel">
        <div class="list-controls">
            <input id="filter" placeholder="Filter by company name..." oninput="renderApplications()">
            <button onclick="loadApplications()">Load / refresh</button>
            <span class="count" id="count"></span>
        </div>
    </div>
    <div class="panel table-scroll">
        <table>
            <thead>
            <tr>
                <th class="sortable" id="th-companyName" onclick="setSort('companyName')" title="Sort by Company">Company<span class="sort-icon"></span></th>
                <th class="col-desc">Description</th>
                <th class="sortable" id="th-rateAmount" onclick="setSort('rateAmount')" title="Sort by Rate">Rate<span class="sort-icon"></span></th>
                <th class="sortable" id="th-paidLeave" onclick="setSort('paidLeave')" title="Sort by Paid leave">Paid leave<span class="sort-icon"></span></th>
                <th class="sortable" id="th-sentAt" onclick="setSort('sentAt')" title="Sort by Sent date">Sent<span class="sort-icon"></span></th>
                <th class="sortable" id="th-updatedAt" onclick="setSort('updatedAt')" title="Sort by Updated date">Updated<span class="sort-icon"></span></th>
                <th class="sortable" id="th-status" onclick="setSort('status')" title="Sort by Status">Status<span class="sort-icon"></span></th>
                <th>CV</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="rows">
            <tr><td colspan="9" class="muted">Log in, then "Load / refresh".</td></tr>
            </tbody>
        </table>
    </div>

    <h2>Other</h2>
    <div class="panel links">
        <a href="/index.html">API Console</a>
    </div>
</div>

<script>
    let accessToken = null;

    const v = id => document.getElementById(id).value;
    const out = document.getElementById('out');
    const authState = document.getElementById('authState');

    async function login() {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: v('user'), password: v('pass')})
        });
        if (!res.ok) {
            authState.textContent = 'login failed (' + res.status + ')';
            return;
        }
        const tokenPair = await res.json();
        accessToken = tokenPair.accessToken;
        authState.textContent = 'logged in, access token expires in ' + tokenPair.expiresIn + 's';
        loadApplications();
    }

    function render(statusHtml, text) {
        out.innerHTML = statusHtml + '\n\n';
        out.appendChild(document.createTextNode(text));
    }

    async function submitApplication(event) {
        event.preventDefault();

        const formData = new FormData();
        formData.append('companyName', v('companyName'));
        formData.append('rateType', v('rateType'));
        if (v('rateAmount')) formData.append('rateAmount', v('rateAmount'));
        formData.append('paidLeave', document.getElementById('paidLeave').checked);
        formData.append('vacationDays', v('vacationDays') || '0');

        const cvFile = document.getElementById('cv').files[0];
        if (cvFile) formData.append('cv', cvFile);

        const headers = {};
        if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

        out.textContent = 'POST /job-applications ...';

        try {
            // no Content-Type header on purpose - the browser sets multipart/form-data with the right boundary
            const res = await fetch('/job-applications', {method: 'POST', headers, body: formData});

            const text = await res.text();
            let pretty = text;
            try {
                pretty = JSON.stringify(JSON.parse(text), null, 2);
            } catch (ignored) {
                pretty = text;
            }

            const cls = res.ok ? 'ok' : 'bad';
            render('<span class="status ' + cls + '">' + res.status + ' ' + res.statusText + '</span>', pretty || '(empty response)');

            // the form (including the selected CV) is intentionally left as-is after submit,
            // so the same file is still there for the next application
            loadApplications();
        } catch (e) {
            render('<span class="status bad">NETWORK ERROR</span>', String(e));
        }
    }

    let applications = [];
    const pendingEdits = new Map();
    const rows = document.getElementById('rows');
    const count = document.getElementById('count');
    let sortCol = null;
    let sortDir = null;

    async function loadApplications() {
        const headers = {};
        if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

        const res = await fetch('/job-applications?size=500', {headers});
        if (!res.ok) {
            rows.innerHTML = '<tr><td colspan="9" class="muted">Failed to load (' + res.status + ')</td></tr>';
            return;
        }

        const page = await res.json();
        applications = page.content || [];
        pendingEdits.clear();
        updateSortHeaders();
        renderApplications();
    }

    function setSort(col) {
        if (sortCol === col) {
            if (sortDir === 'asc') {
                sortDir = 'desc';
            } else {
                sortCol = null;
                sortDir = null;
            }
        } else {
            sortCol = col;
            sortDir = 'asc';
        }
        updateSortHeaders();
        renderApplications();
    }

    function updateSortHeaders() {
        ['companyName', 'rateAmount', 'paidLeave', 'sentAt', 'updatedAt', 'status'].forEach(col => {
            const th = document.getElementById('th-' + col);
            if (!th) return;
            const icon = th.querySelector('.sort-icon');
            if (sortCol === col) {
                icon.textContent = sortDir === 'asc' ? ' ▲' : ' ▼';
                th.classList.add('sorted');
            } else {
                icon.textContent = '';
                th.classList.remove('sorted');
            }
        });
    }

    function renderApplications() {
        const needle = v('filter').trim().toLowerCase();
        let list = needle
            ? applications.filter(a => (a.companyName && a.companyName.toLowerCase().includes(needle)) || (a.description && a.description.toLowerCase().includes(needle)))
            : applications.slice();

        if (sortCol) {
            list.sort((a, b) => {
                let vA = a[sortCol];
                let vB = b[sortCol];

                if (sortCol === 'rateAmount') {
                    vA = vA != null ? Number(vA) : -1;
                    vB = vB != null ? Number(vB) : -1;
                } else if (sortCol === 'paidLeave') {
                    vA = a.paidLeave ? (a.vacationDays || 0) : -1;
                    vB = b.paidLeave ? (b.vacationDays || 0) : -1;
                } else if (typeof vA === 'string' || typeof vB === 'string') {
                    vA = (vA || '').toLowerCase();
                    vB = (vB || '').toLowerCase();
                    return sortDir === 'asc' ? vA.localeCompare(vB) : vB.localeCompare(vA);
                }

                if (vA < vB) return sortDir === 'asc' ? -1 : 1;
                if (vA > vB) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });
        }

        count.textContent = list.length + ' / ' + applications.length;

        if (list.length === 0) {
            rows.innerHTML = '<tr><td colspan="9" class="muted">No matching applications.</td></tr>';
            return;
        }

        rows.innerHTML = list.map(a => {
            const pending = pendingEdits.get(a.id);
            const isDirty = !!pending;
            const currentDesc = isDirty ? pending.description : (a.description || '');
            const currentStatus = isDirty ? pending.status : a.status;

            return `
            <tr id="row-${a.id}" class="${isDirty ? 'modified' : ''}">
                <td>${escapeHtml(a.companyName)}</td>
                <td class="col-desc"><input id="desc-${a.id}" data-id="${a.id}" value="${escapeAttr(currentDesc)}" oninput="onRowChange('${a.id}')"></td>
                <td>${a.rateType}${a.rateAmount != null ? ' ' + a.rateAmount : ''}</td>
                <td>${a.paidLeave ? a.vacationDays + ' days' : 'no'}</td>
                <td>${formatDate(a.sentAt)}</td>
                <td>${formatDate(a.updatedAt)}</td>
                <td><select id="status-${a.id}" data-id="${a.id}" onchange="onRowChange('${a.id}')">${statusOptions(currentStatus)}</select></td>
                <td>
                    ${a.hasCv ? `
                        <div class="cv-actions">
                            <button onclick="previewCv('${a.id}')" title="Preview PDF in new tab">View</button>
                            <button onclick="downloadCv('${a.id}', '${escapeJs(a.companyName)}')" title="Download PDF">⬇</button>
                        </div>
                    ` : '<span class="muted">none</span>'}
                </td>
                <td>
                    <div class="row-actions">
                        <span class="edit-actions" id="edit-actions-${a.id}" style="${isDirty ? 'display: inline-flex;' : 'display: none;'}">
                            <button class="save-btn" onclick="saveApplication('${a.id}')" title="Save changes">Save</button>
                            <button class="cancel-btn" onclick="cancelApplicationEdit('${a.id}')" title="Cancel changes">Cancel</button>
                        </span>
                        <button class="delete-btn" title="Delete" onclick="deleteApplication('${a.id}', '${escapeJs(a.companyName)}')">✕</button>
                    </div>
                </td>
            </tr>
            `;
        }).join('');
    }

    const STATUSES = ['SENT', 'WITHDRAWN', 'REJECTED', 'ACCEPTED'];

    function statusOptions(current) {
        return STATUSES.map(s => `<option value="${s}"${s === current ? ' selected' : ''}>${s}</option>`).join('');
    }

    function onRowChange(id) {
        const app = applications.find(a => a.id === id);
        if (!app) return;

        const descInput = document.getElementById('desc-' + id);
        const statusSelect = document.getElementById('status-' + id);
        const row = document.getElementById('row-' + id);
        const actions = document.getElementById('edit-actions-' + id);

        const currentDesc = descInput ? descInput.value : (app.description || '');
        const currentStatus = statusSelect ? statusSelect.value : app.status;

        const isDirty = (currentDesc !== (app.description || '')) || (currentStatus !== app.status);

        if (isDirty) {
            pendingEdits.set(id, { description: currentDesc, status: currentStatus });
        } else {
            pendingEdits.delete(id);
        }

        if (row) row.classList.toggle('modified', isDirty);
        if (actions) actions.style.display = isDirty ? 'inline-flex' : 'none';
    }

    function cancelApplicationEdit(id) {
        const app = applications.find(a => a.id === id);
        if (!app) return;

        pendingEdits.delete(id);

        const descInput = document.getElementById('desc-' + id);
        const statusSelect = document.getElementById('status-' + id);

        if (descInput) descInput.value = app.description || '';
        if (statusSelect) statusSelect.value = app.status;

        const row = document.getElementById('row-' + id);
        const actions = document.getElementById('edit-actions-' + id);

        if (row) row.classList.remove('modified');
        if (actions) actions.style.display = 'none';
    }

    async function saveApplication(id) {
        const app = applications.find(a => a.id === id);
        if (!app) return;

        const descInput = document.getElementById('desc-' + id);
        const statusSelect = document.getElementById('status-' + id);

        const description = descInput ? descInput.value : (app.description || '');
        const status = statusSelect ? statusSelect.value : app.status;

        await patchJobApplication(id, '', {
            description,
            status,
            version: app.version
        });
    }

    async function patchJobApplication(id, path, body) {
        const headers = {'Content-Type': 'application/json'};
        if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

        out.textContent = 'PATCH /job-applications/' + id + path + ' ...';

        try {
            const res = await fetch('/job-applications/' + id + path, {
                method: 'PATCH', headers, body: JSON.stringify(body)
            });

            const text = await res.text();
            let pretty = text;
            try {
                pretty = JSON.stringify(JSON.parse(text), null, 2);
            } catch (ignored) {
                pretty = text;
            }

            const cls = res.ok ? 'ok' : 'bad';
            render('<span class="status ' + cls + '">' + res.status + ' ' + res.statusText + '</span>', pretty || '(empty response)');

            if (!res.ok) {
                alert('Update failed (' + res.status + ')');
                return;
            }

            const updated = JSON.parse(text);
            const idx = applications.findIndex(a => a.id === id);
            if (idx !== -1) applications[idx] = updated;
            pendingEdits.delete(id);
            renderApplications();
        } catch (e) {
            render('<span class="status bad">NETWORK ERROR</span>', String(e));
        }
    }

    async function deleteApplication(id, companyName) {
        if (!confirm('Delete application for ' + companyName + '?')) return;

        const headers = {};
        if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

        const res = await fetch('/job-applications/' + id, {method: 'DELETE', headers});
        if (!res.ok) {
            alert('Delete failed (' + res.status + ')');
            return;
        }

        pendingEdits.delete(id);
        applications = applications.filter(a => a.id !== id);
        renderApplications();
    }

    function formatDate(iso) {
        return iso ? iso.replace('T', ' ').slice(0, 16) : '';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function escapeJs(text) {
        return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function escapeAttr(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    async function previewCv(id) {
        const headers = {};
        if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

        try {
            const res = await fetch('/job-applications/' + id + '/cv', {headers});
            if (!res.ok) {
                alert('Failed to preview CV (' + res.status + ')');
                return;
            }

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        } catch (e) {
            alert('Failed to preview CV: ' + e);
        }
    }

    async function downloadCv(id, companyName) {
        const headers = {};
        if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

        const res = await fetch('/job-applications/' + id + '/cv', {headers});
        if (!res.ok) {
            alert('Download failed (' + res.status + ')');
            return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = companyName.replace(/[^a-zA-Z0-9-]+/g, '_') + '-cv.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
