server:
  port: 8080

spring:
  datasource:
    url: "jdbc:postgresql://postgres:5432/dev_user"
    username: "dev_user"
    password: "dev"

  mongodb:
    uri: "mongodb://dev_user:dev@mongo:27017/sandbox?authSource=admin"

  data:
    web:
      pageable:
        max-page-size: 200

  liquibase:
    change-log: "classpath:liquibase-changeLog.xml"

  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  ai:
    mcp:
      server:
        name: fen-server
        version: 0.0.1
        protocol: STATELESS

files:
  baseDir: "/app/data/Data.txt"

data:
  exampleUri: "https://jsonplaceholder.typicode.com/posts"
  passphraseUrl: "http://foo:8090/secret"

audit:
  patterns: '/**'


logging:
  level:
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN